port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false
  stun_servers:
    - stun.l.google.com:19302
keys:
  devkey: secret
room:
  auto_create: true
  max_participants: 2000
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
limit:
  num_tracks: 8000
  bytes_per_sec: 1000000000
