# LAN portal on dedicated ports (not 80/8080/5173/8000).
# UI: 18080 (alt 18081). API proxied from 127.0.0.1:18000.
server {
    listen 18080 default_server;
    listen [::]:18080 default_server;
    listen 18081 default_server;
    listen [::]:18081 default_server;
    server_name _;
    root /var/www/cyberrange;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:18000/docs;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:18000/redoc;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:18000/openapi.json;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:18000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
