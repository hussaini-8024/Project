# Portal for the campus server 172.26.1.3.
# Port 80 is required so http://127.0.0.1/login and http://172.26.1.3/login work.
# 8080 and 18080 are fallbacks. API is proxied from 127.0.0.1:18000.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080 default_server;
    listen [::]:8080 default_server;
    listen 18080 default_server;
    listen [::]:18080 default_server;
    listen 18081 default_server;
    listen [::]:18081 default_server;
    server_name _;
    root /var/www/cyberrange;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:18000/docs;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:18000/redoc;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:18000/openapi.json;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:18000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
