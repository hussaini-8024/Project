services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pkcouncil
      MYSQL_USER: pkcouncil
      MYSQL_PASSWORD: pkcouncil
      MYSQL_ROOT_PASSWORD: pkcouncil_root
    volumes:
      - pkcouncil_db:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: pkcouncil
      WORDPRESS_DB_PASSWORD: pkcouncil
      WORDPRESS_DB_NAME: pkcouncil
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 0
    volumes:
      - pkcouncil_wp:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/pkcouncil-core
      - ./theme:/var/www/html/wp-content/themes/pkcouncil

volumes:
  pkcouncil_db:
  pkcouncil_wp:
